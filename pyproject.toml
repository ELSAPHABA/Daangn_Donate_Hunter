[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daangn-donate-hunter"
version = "0.1.0"
description = "Telegram bot that detects free items on Daangn and sends alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4==4.12.3",
  "python-dotenv==1.0.1",
  "python-telegram-bot[job-queue]==21.9",
  "requests[socks]==2.32.3",
]

[project.scripts]
daangn-donate-hunter = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["bot*", "core*", "monitoring*", "notifications*", "resources*", "scraping*", "storage*", "utils*"]

[tool.setuptools.package-data]
resources = ["*.txt"]
